# Replace every <...> placeholder with the actual entity ID from Smartmi P1 Local.
# This P1 card requires no HomeKit entities.
type: vertical-stack
cards:
  - type: tile
    entity: <fan_p1>
    name: Smartmi P1
    features:
      - type: fan-speed
  - type: entities
    title: Luftqualität und Filter
    entities:
      - entity: <sensor_pm25>
      - entity: <sensor_pm10>
      - entity: <sensor_filter_life>
      - entity: <sensor_filter_hours>
  - type: entities
    title: Smartmi P1 · Einstellungen
    entities:
      - entity: <select_mode>
      - entity: <select_timer>
      - entity: <select_display>
      - entity: <switch_sound>
      - entity: <lock_child_lock>
